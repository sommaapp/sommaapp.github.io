name: PostgREST pagination integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/postgrest-pagination.integration.cjs'
      - '.github/workflows/postgrest-pagination-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgrest-pagination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start disposable PostgreSQL
        run: |
          docker network create somma-test
          docker run -d --name somma-pg --network somma-test --network-alias postgres \
            -e POSTGRES_PASSWORD=testpass -e POSTGRES_USER=postgres \
            postgres:16
          for i in {1..30}; do
            if docker exec somma-pg pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec somma-pg pg_isready -U postgres
      - name: Create synthetic schema and rows
        run: |
          docker exec -i somma-pg psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE ROLE web_anon NOLOGIN;
          CREATE ROLE authenticator LOGIN PASSWORD 'testpass' NOINHERIT;
          GRANT web_anon TO authenticator;
          CREATE SCHEMA api;
          CREATE TABLE api.requests (
            id uuid PRIMARY KEY,
            status text NOT NULL,
            created_at timestamptz NOT NULL,
            expires_at timestamptz
          );
          INSERT INTO api.requests (id, status, created_at, expires_at) VALUES
            ('11111111-1111-4111-8111-111111111111', 'active', '2026-10-20T10:00:00Z', NULL),
            ('22222222-2222-4222-8222-222222222222', 'active', '2026-10-20T10:00:00Z', NULL),
            ('33333333-3333-4333-8333-333333333333', 'active', '2026-10-20T10:00:00Z', '2099-01-01T00:00:00Z'),
            ('44444444-4444-4444-8444-444444444444', 'active', '2026-10-20T09:00:00Z', '2000-01-01T00:00:00Z'),
            ('55555555-5555-4555-8555-555555555555', 'completed', '2026-10-20T08:00:00Z', NULL);
          GRANT USAGE ON SCHEMA api TO web_anon;
          GRANT SELECT ON api.requests TO web_anon;
          SQL
      - name: Start disposable PostgREST
        run: |
          docker run -d --name somma-postgrest --network somma-test -p 3000:3000 \
            -e PGRST_DB_URI='postgres://authenticator:testpass@postgres:5432/postgres' \
            -e PGRST_DB_SCHEMAS='api' \
            -e PGRST_DB_ANON_ROLE='web_anon' \
            -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/
      - name: Verify actual PostgREST cursor and expiry filters
        run: node tests/postgrest-pagination.integration.cjs
      - name: Stop disposable containers
        if: always()
        run: |
          docker rm -f somma-postgrest somma-pg || true
          docker network rm somma-test || true
